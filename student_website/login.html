<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In - AI Smart Institute</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <div style="width: 40px; height: 40px; background: var(--primary-blue); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin-bottom: 8px;">AI</div>
      <h1>AI SMART INSTITUTE</h1>
      <p>Institutional Academic & Management Portal</p>
    </div>

    <div class="auth-body">
      <div id="login-error" class="alert alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username" class="form-label">Username / Registration ID <span class="required">*</span></label>
          <input type="text" id="username" class="form-control" placeholder="e.g. STU001 or admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 12.5px;">
          <label style="display: flex; align-items: center; gap: 6px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="remember-me" style="cursor: pointer;"> Remember on this device
          </label>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
          Sign In to Portal
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <div>Need account assistance? Contact <a href="#">support@institute.edu</a></div>
      <div style="margin-top: 6px;"><a href="index.html">&larr; Return to Institute Home</a></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
